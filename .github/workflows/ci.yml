name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # `postinstall` runs `prisma generate`, which loads prisma.config.ts.
      # That file reads MONGODB_URI without prisma/config's `env()` helper
      # precisely so this step works with no database and no secrets.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

      # No secrets here either: `lib/env.ts` skips validation during
      # NEXT_PHASE=phase-production-build, and the boot-time check lives in
      # instrumentation.ts, which Next does not run for a build.
      - run: pnpm build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Independent of the job above on purpose: it is the only thing that
      # catches the Dockerfile drifting out of sync with the app.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
